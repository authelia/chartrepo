access_control:
  default_policy: {{ include "authelia.accessControl.defaultPolicy" . | trim | squote }}
  {{- if and (semverCompare "<4.39.0" (include "authelia.version" $)) .Values.configMap.definitions .Values.configMap.definitions.network (gt (len .Values.configMap.definitions.network) 0) }}
  networks:
  {{- range $name, $networks := .Values.configMap.definitions.network }}
    - name: {{ $name }}
      networks:
    {{- if kindIs "string" $networks }}
        - {{ $networks | squote }}
    {{- else }}
    {{- range $value := $networks }}
        - {{ $value | squote }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.configMap.access_control.rules }}
  rules:
  {{- range .Values.configMap.access_control.rules }}
    - policy: {{ .policy | default "deny" }}
      {{- if .domain }}
      domain:
      {{- if kindIs "string" .domain }}
        - {{ .domain | squote }}
      {{- else }}
        {{- include "authelia.squote.list" .domain | indent 8 }}
      {{- end }}
      {{- end }}
      {{- if .domain_regex }}
      domain_regex:
      {{- if kindIs "string" .domain_regex }}
        - {{ .domain_regex | squote }}
      {{- else }}
        {{- include "authelia.squote.list" .domain_regex | indent 8 }}
      {{- end }}
      {{- end }}
      {{- if .networks }}
      networks:
      {{- if kindIs "string" .networks }}
        - {{ .networks }}
      {{- else }}
      {{- range .networks }}
        - {{ . }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .query }}
      query:
      {{- range $outer := .query }}
        -
        {{- range $rule := $outer }}
          - operator: {{ $rule.operator | squote }}
            key: {{ $rule.key | squote }}
            {{- if $rule.value }}
            value: {{ $rule.value | squote }}
            {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- if .subject }}
      subject:
      {{- if kindIs "string" .subject }}
        - [{{ .subject | squote }}]
      {{- else }}
      {{- range .subject }}
        - [{{ include "authelia.squote.join" . }}]
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .methods }}
      methods:
      {{- if kindIs "string" .methods }}
        - {{ .methods | squote }}
      {{- else }}
      {{- range .methods }}
        - {{ . | squote }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .resources }}
      resources:
      {{- if kindIs "string" .resources }}
        - {{ .resources | squote }}
      {{- else }}
      {{- range .resources }}
        - {{ . | squote }}
      {{- end }}
      {{- end }}
      {{- end }}
  {{- end }}
  {{- end }}
